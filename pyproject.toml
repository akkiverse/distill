[project]
name = "distill"
version = "0.1.0"
description = "Distill API: news for chosen sections and keywords, curated by Studio AI into cards that expire."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.9",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/api"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py312"
# studio_ai.py and studio_auth.py are the hub's kits, copied unchanged.
extend-exclude = ["node_modules", "dist", "backend/distill/studio_ai.py", "backend/distill/studio_auth.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
